<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Better Self"><meta name="theme-color" content="#f6f3ed"><title>Better Self</title><style>
:root{--bg:#f6f3ed;--card:#fff;--ink:#18201d;--muted:#68706c;--green:#245b48;--pink:#8b3d55;--orange:#9b5b19;--line:#dedbd4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:920px;margin:auto;min-height:100vh;padding:24px 22px 100px}h1{font-size:34px;margin:12px 0 6px}h2{font-size:25px}.sub{color:var(--muted);line-height:1.45}.tabs{position:fixed;bottom:0;left:0;right:0;background:#ffffffea;backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}.tabs button{width:25%;max-width:230px;padding:14px 5px 18px;border:0;background:none;font:inherit;color:#666}.tabs button.active{color:var(--green);font-weight:700}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin:15px 0;box-shadow:0 5px 22px #0000000a}.kicker{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--green)}button.primary{background:var(--green);color:white;border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:700}button.secondary{background:#eeeae2;color:var(--ink);border:0;border-radius:12px;padding:11px 14px;font-size:15px;font-weight:650}button.ghost{background:none;border:1px solid var(--line);border-radius:12px;padding:10px 13px}textarea{width:100%;min-height:125px;border:1px solid #cfcac0;border-radius:12px;padding:12px;font:16px/1.45 -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;resize:vertical}.prompt{font-weight:700;margin:20px 0 8px}.row{display:flex;gap:10px;flex-wrap:wrap}.hidden{display:none}.pill{display:inline-block;border-radius:20px;background:#ede9df;padding:5px 10px;font-size:13px;margin-bottom:5px}.easy{color:#26704d}.thoughtful{color:var(--orange)}.bigger{color:var(--pink)}ol{padding-left:22px;line-height:1.55}.quote{padding:14px;border-left:4px solid var(--green);background:#f3f7f4;border-radius:8px;font-style:italic}.warn{font-size:13px;color:var(--muted);padding-top:10px}.historyItem{border-bottom:1px solid var(--line);padding:12px 0}.done{opacity:.55}.back{margin:4px 0 10px}@media(min-width:700px){.app{padding-top:35px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid .card{margin:0}}
</style></head><body><main class="app" id="app"></main><nav class="tabs" id="tabs"></nav><script>
const exercises=[
{id:'ego',cat:'INSECURITY',title:'Ego audit',purpose:'Identify what your self-image is trying to protect.',intro:'Answer bluntly. Do not write what sounds mature. Write what is true.',q:['I particularly want people to think I am…','I hate people thinking I am…','When I feel stupid or inadequate, I tend to…','The criticism I find hardest to hear is…','If I felt secure, I would no longer need to…'],reflect:'What answer was hardest to write honestly?'},
{id:'defence',cat:'ACCOUNTABILITY',title:'Remove the defence',purpose:'Practise owning conduct without explanation, mitigation or blame.',intro:'Use a fictional or remembered mistake. The second answer cannot use but, because, although or however.',q:['Describe the mistake in your usual way.','Rewrite it: “I did X. It affected the other person by Y. I should have done Z.”'],reflect:'Which explanation were you most reluctant to remove?'},
{id:'other',cat:'DEFENSIVENESS',title:'Argue against yourself',purpose:'Build tolerance for another person being partly or wholly right.',intro:'Choose a disagreement. Your job is not to win. Make the strongest fair case for the other position.',q:['State your position.','State the other person’s position without weakening it.','Write the strongest case that their position is right.','What part of their criticism may be true?'],reflect:'What did you notice when you stopped preparing a rebuttal?'},
{id:'truth',cat:'HONESTY',title:'Correct the story',purpose:'Practise correcting an ego-protecting distortion quickly and plainly.',intro:'Write the flattering version first, then the exact version.',q:['Write the version designed to protect your image.','What facts did that version omit, minimise or alter?','Correct it: “That was not completely true. What actually happened was…”'],reflect:'What were you trying to prevent another person from thinking about you?'},
{id:'apology',cat:'ACCOUNTABILITY',title:'Write a clean apology',purpose:'Practise apology without self-defence or pressure for forgiveness.',intro:'Scenario: your wife says you were looking at your phone while she spoke. You denied it and accused her of doing the same.',q:['Write your first instinctive response.','Now write: what I did; its likely effect; ownership; what I will do differently.'],reflect:'Did you use “but”, counter-accuse, minimise, or demand reassurance?'},
{id:'unimpressive',cat:'INSECURITY',title:'Practise being unimpressive',purpose:'Separate personal worth from status, expertise and achievement.',intro:'Do not mention work, money, qualifications, possessions or achievements.',q:['Who are you when none of those things can be used?','List three things you do not need to prove.','Name one ordinary weakness you can allow to be visible.'],reflect:'What did you want to add to restore your image?'},
{id:'vulnerable',cat:'VULNERABILITY',title:'Say the vulnerable sentence',purpose:'Practise expressing hurt or uncertainty instead of anger or withdrawal.',intro:'Complete each sentence plainly. Do not turn it into a joke.',q:['I feel inadequate when…','When that happens, I protect myself by…','A more honest sentence I could say is…'],reflect:'Read the final sentence aloud once. What felt difficult about it?'},
{id:'generous',cat:'EMPATHY',title:'Three generous explanations',purpose:'Interrupt hostile assumptions about another person’s motives.',intro:'Choose an annoying behaviour. Generate plausible explanations that are not “they are selfish, stupid or against me”.',q:['Describe the behaviour without judging motive.','Possible explanation one…','Possible explanation two…','Possible explanation three…','What question could you ask instead of assuming?'],reflect:'Which explanation changed your reaction most?'}];
const wife=[
{level:'Easy',title:'Give ten minutes of full attention',why:'Show that she matters by being wholly present.',steps:['Put your phone out of reach.','Sit near her at a suitable moment.','Ask one open question.','Listen before offering a solution.'],script:'How are you really going? Do you want me to listen, help think it through, or do something practical?',avoid:'Do not interrupt, compare it with your day, or force conversation if she wants quiet.',fallback:'Ask when she would like ten quiet minutes together.'},
{level:'Easy',title:'Send a message expecting nothing',why:'Show that she is in your mind during an ordinary day.',steps:['Mention something real from her day.','Keep it warm and short.','Do not attach a request.'],script:'Thinking of you. I hope [specific thing] goes well. No need to reply if you’re busy.',avoid:'Do not immediately follow with a question about errands or dinner.',fallback:'Leave a short handwritten note instead.'},
{level:'Thoughtful',title:'Take one whole task off her plate',why:'Complete the whole task so she does not have to manage it.',steps:['Identify a task she would otherwise remember or organise.','Complete every part, including clean-up.','Tell her briefly what is handled.'],script:'I’ve sorted [specific task], including [follow-through], so you don’t need to think about it.',avoid:'Do not do half, ask her to supervise, or expect praise.',fallback:'Offer two specific tasks and ask which would be more useful.'},
{level:'Thoughtful',title:'Give specific appreciation',why:'Notice something real rather than giving a generic compliment.',steps:['Choose something she did or a quality she showed.','Say what you noticed.','Say why it mattered to you.'],script:'I noticed [specific thing]. It made [specific difference], and I really appreciate that about you.',avoid:'Do not add criticism afterwards.',fallback:'Send it as a brief message if saying it aloud feels forced.'},
{level:'Bigger effort',title:'Organise time together',why:'Do the planning yourself while leaving her free to say no.',steps:['Choose something consistent with her tastes.','Check timing and practical constraints.','Arrange bookings, transport and logistics.','Invite her without pressure.'],script:'I’d like to take you to [activity] on [day]. I can organise everything. Would that appeal, or would you prefer a quiet evening together?',avoid:'Do not insist on a surprise or assume she is free.',fallback:'Offer two genuinely suitable options and organise the one she chooses.'},
{level:'Bigger effort',title:'Create a genuinely easier day',why:'Effort can be practical rather than romantic or expensive.',steps:['Identify what normally consumes her time.','Take ownership of meals, chores and one lingering task.','Protect time for whatever she wants to do.','Do not require her to manage you.'],script:'I’m handling [specific responsibilities] today. Use the time however you want; you don’t need to organise me.',avoid:'Do not call it a gift if it is simply your fair share of ordinary responsibilities.',fallback:'Take full responsibility for one defined block, such as dinner through clean-up.'}];
const app=document.getElementById('app'),tabs=document.getElementById('tabs');let page='today',draft={};
function esc(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function hist(){return JSON.parse(localStorage.getItem('bs-history')||'[]')}function saveHist(x){let h=hist();h.unshift(x);localStorage.setItem('bs-history',JSON.stringify(h))}function daily(){return exercises[Math.floor(Date.now()/86400000)%exercises.length]}
function nav(){tabs.innerHTML=['today','exercises','wife','history'].map(x=>`<button class="${page===x?'active':''}" onclick="show('${x}')">${({today:'Today',exercises:'Exercises',wife:'Wife',history:'History'})[x]}</button>`).join('')}
function show(p){page=p;nav();window.scrollTo(0,0);if(p==='today')today();if(p==='exercises')library();if(p==='wife')wifePage();if(p==='history')historyPage()}
function today(){let e=daily();app.innerHTML=`<h1>Better Self</h1><p class="sub">Do one real exercise. Put one piece of effort into your relationship. Reflection is optional.</p><div class="card"><div class="kicker">SELF · ${e.cat}</div><h2>${e.title}</h2><p>${e.purpose}</p><button class="primary" onclick="run('${e.id}')">Start exercise</button></div><div class="card"><div class="kicker">RELATIONSHIP</div><h2>Put in some effort</h2><p>Easy, thoughtful and bigger-effort suggestions with exact steps and words.</p><button class="primary" onclick="show('wife')">Show suggestions</button></div><p class="warn">Private practice tool, not diagnosis or therapy. If an exercise causes significant distress or relationship safety is an issue, stop and seek appropriate professional support.</p>`}
function library(){app.innerHTML=`<h1>Exercises</h1><p class="sub">Concrete practice, completed inside the app.</p><div class="grid">${exercises.map(e=>`<div class="card"><div class="kicker">${e.cat}</div><h2>${e.title}</h2><p>${e.purpose}</p><button class="primary" onclick="run('${e.id}')">Open</button></div>`).join('')}</div>`}
function run(id){let e=exercises.find(x=>x.id===id);app.innerHTML=`<button class="ghost back" onclick="show('exercises')">← Back</button><div class="kicker">${e.cat}</div><h1>${e.title}</h1><p>${e.purpose}</p><div class="card"><strong>Instructions</strong><p>${e.intro}</p></div><form id="form">${e.q.map((q,i)=>`<div class="card"><div class="prompt">${i+1}. ${q}</div><textarea id="q${i}" placeholder="Write here…">${esc((draft[id]||[])[i]||'')}</textarea></div>`).join('')}<div class="card"><div class="prompt">Optional reflection</div><p class="sub">${e.reflect}</p><textarea id="reflection" placeholder="Optional…"></textarea></div><button type="button" class="primary" onclick="finish('${id}')">Complete and save</button></form>`;page='runner';nav()}
function finish(id){let e=exercises.find(x=>x.id===id),answers=e.q.map((_,i)=>document.getElementById('q'+i).value.trim());draft[id]=answers;if(answers.some(x=>x.length<3)){alert('Write something for each required step before saving.');return}saveHist({type:'exercise',title:e.title,date:new Date().toISOString(),answers,reflection:document.getElementById('reflection').value});delete draft[id];show('history')}
function pick(level){let arr=wife.filter(x=>x.level===level);return arr[Math.floor(Math.random()*arr.length)]}let selected={};function wifePage(){['Easy','Thoughtful','Bigger effort'].forEach(l=>selected[l]??=pick(l));app.innerHTML=`<h1>Effort for my wife</h1><p class="sub">Choose one and do it properly. “Bigger” means more thought, planning or time, not necessarily more money.</p>${['Easy','Thoughtful','Bigger effort'].map(l=>suggestion(selected[l])).join('')}<p class="warn">The app offers options. It should never presume what your wife feels or pressure her to participate.</p>`}
function suggestion(s){let c=s.level==='Easy'?'easy':s.level==='Thoughtful'?'thoughtful':'bigger';return `<div class="card"><div class="kicker ${c}">${s.level.toUpperCase()}</div><h2>${s.title}</h2><p>${s.why}</p><ol>${s.steps.map(x=>`<li>${x}</li>`).join('')}</ol><div class="prompt">Words you can use</div><div class="quote">“${s.script}”</div><div class="prompt">Avoid</div><p>${s.avoid}</p><div class="prompt">If the moment is wrong</div><p>${s.fallback}</p><div class="row"><button class="primary" onclick='doneWife(${JSON.stringify(s.title)},${JSON.stringify(s.level)})'>Mark completed</button><button class="secondary" onclick='again(${JSON.stringify(s.level)})'>Another idea</button></div></div>`}
function again(level){let cur=selected[level];let arr=wife.filter(x=>x.level===level&&x.title!==cur.title);selected[level]=arr.length?arr[Math.floor(Math.random()*arr.length)]:cur;wifePage()}function doneWife(title,level){saveHist({type:'relationship',title,level,date:new Date().toISOString()});historyPage();page='history';nav()}
function historyPage(){let h=hist();app.innerHTML=`<h1>History</h1><p class="sub">Stored privately in this browser on this device.</p><div class="card">${h.length?h.map(x=>`<div class="historyItem"><strong>${esc(x.title)}</strong><div class="sub">${x.type==='relationship'?esc(x.level)+' · ':''}${new Date(x.date).toLocaleDateString()}</div>${x.type==='exercise'?`<details><summary>View answers</summary>${x.answers.map(a=>`<p>${esc(a)}</p>`).join('')}${x.reflection?`<p><strong>Reflection:</strong> ${esc(x.reflection)}</p>`:''}</details>`:''}</div>`).join(''):'Nothing completed yet.'}</div><button class="ghost" onclick="if(confirm('Delete all saved history?')){localStorage.removeItem('bs-history');historyPage()}">Clear history</button>`}
show('today');
</script></body></html>
